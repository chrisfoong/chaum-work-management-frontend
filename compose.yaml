name: chaum

# Requires the backend repository beside this repository.
# Include keeps its build/env paths relative to the backend repository.
include:
  - ../chaum-work-management-backend/compose.yaml

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_LINE_WEB_LIFF_ID: ${NEXT_PUBLIC_LINE_WEB_LIFF_ID:-}
        NEXT_PUBLIC_LINE_WORKER_LIFF_ID: ${NEXT_PUBLIC_LINE_WORKER_LIFF_ID:-}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
